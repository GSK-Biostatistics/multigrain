# ---------------------------------------------------------------------------
notes:
  - id: reshape
    text: >
      The reshape is the architectural trick and earns the one long edge label: the
      transform writes an N x m x K numeric array and the kernel reads the same
      memory as an N x mK matrix, because R is column-major. No boundary, spending
      function, information fraction or data mask crosses into C++ (S4.1, S4.3).
  - id: not_drawn
    text: >
      Deliberately absent although the record names them: the fixed-sample exports
      simulate_pvalues(), trial_success(), graph_optimise() and calc_power_pvals(),
      and the helpers create_obj_func(), power_criterion(), prune_graph(),
      .try_prune(), control_prepare(), parse_and_transform() and
      check_double_matrix() (all S3). They are the unchanged counterparts of the
      `_gsd` family, not dependencies of it (S4.7, S4.10), so drawing them would
      double the diagram for no information. S3 records them instead as constraints
      on the design: check_double_matrix() rejects arrays and S3 objects, which is
      why control_prepare_dims() exists.
  - id: rcpp_exports
    text: >
      R to C++ calls run through R/RcppExports.R and src/RcppExports.cpp, both
      regenerated by Rcpp::compileAttributes() (S4.10). Edges to the kernels are
      drawn direct rather than routed through that binding layer.
  - id: test_scaffolding
    text: >
      Not nodes, being test code rather than package architecture, but named by the
      record: tests/testthat/helper-gsd_reference.R with gsd_reference_direct() and
      gsd_pvals_matrix(), the Appendix B boundary-on-the-fly reference and the dim<-
      reshape (P2), and dev/gsd_identity_check.R, the S4.10 no-change gate run
      against installed main and branch builds (P4).
  - id: build_state
    text: >
      Built and on the branch: the transform (P0, e4ec646), the simulator
      (P1, 96dba9f), the kernel (P2, d0b6556). Specified only: the gain (P3), the
      optimiser, pruning and power reporting (P4), documentation (P5). A rendering
      should distinguish the two, since about half the graph is not yet code.
  - id: merge_followup
    text: >
      S10 item 4: once branch plan-for-sparsity has landed, create_obj_func_gsd(),
      the two optimiser drivers and .try_prune_gsd() are to be folded back into their
      fixed-sample versions behind a kernel-dispatch argument, making the
      fixed-sample case K = 1 of one implementation. The duplicated plumbing in the
      internal_r layer is therefore deliberate and temporary.
